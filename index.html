<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>

</head>
<body>

  <main>
    <!-- Background Card Section -->
    <section>
      <img src="images/bg-pattern-card.svg" alt="background-pattern-card">
    </section>

    <!-- Profile Section -->
    <section>
      <!-- Main Info Div -->
      <div>
        <!-- Image Container -->
        <div>
          <img src="images/image-victor.jpg" alt="profile-image">
        </div>
        <h1>Victor Crest</h1>
        <p>London</p>
      </div>

      <!-- Stats Div -->
      <div>
        <!-- Followers -->
        <div>
          <h2>80K</h2>
          <p>Followers</p>
        </div>

        <!-- Likes -->
        <div>
          <h2>803K</h2>
          <p>Likes</p>
        </div>

        <!-- Photos -->
        <div>
          <h2>1.4K</h2>
          <p>Photos</p>
        </div>
      </div>
      
    </section>

  </main>

  <!-- Victor Crest
  26
  London

  80K
  Followers

  803K
  Likes

  1.4K
  Photos -->

</body>
</html>
